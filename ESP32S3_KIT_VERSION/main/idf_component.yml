dependencies:
  idf: ">=5.1.3"
  # Board support package for the ESP32-S3-USB-OTG dev kit. Provides the
  # ST7789 LCD (via LVGL port), buttons, SD card and the USB host power
  # control used in the zadani (bsp_usb_host_start / bsp_usb_host_power_mode).
  # Pulls in LVGL, esp_lvgl_port, esp_lcd and the button component.
  espressif/esp32_s3_usb_otg: "^2.0.4"
  # TinyUSB device stack for the "PC mode" (M6a): the board switches the OTG
  # port to device role and exposes the SD card as a USB Mass Storage disk.
  espressif/esp_tinyusb: "^1.7.0"
  # LittleFS for the "web" flash partition holding the Soft AP page.
  joltwallet/littlefs: "^1.16.0"
