<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCPI Logger</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #c9d1d9; --dim: #8b949e;
    --accent: #00aaff; --ok: #33ff66; --warn: #ffaa00; --err: #ff4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
    max-width: 760px; margin: 0 auto; padding: 16px;
  }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; }
  h1 { color: var(--accent); font-size: 22px; }
  #demo {
    display: none; background: var(--warn); color: #000;
    font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
  }
  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px 16px; margin-bottom: 14px;
  }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
       color: var(--dim); margin-bottom: 10px; }
  /* status */
  #badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge {
    font-size: 12px; padding: 2px 10px; border-radius: 10px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .badge.on  { border-color: var(--ok);  color: var(--ok); }
  .badge.off { border-color: var(--err); color: var(--err); }
  #idn { color: var(--dim); font-size: 13px; margin-bottom: 8px; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  #values td.v { color: var(--ok); font-family: Consolas, monospace; font-size: 18px;
                 text-align: right; white-space: nowrap; }
  #meta { color: var(--dim); font-size: 13px; margin-top: 8px; }
  #meta b { color: var(--text); font-weight: 600; }
  /* controls */
  button, .btn {
    background: var(--panel); border: 1px solid var(--accent); color: var(--accent);
    padding: 6px 18px; border-radius: 6px; font-size: 14px; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  button:hover, .btn:hover { background: var(--accent); color: #000; }
  button.stop { border-color: var(--warn); color: var(--warn); }
  button.stop:hover { background: var(--warn); color: #000; }
  button:disabled { opacity: .35; cursor: default; }
  button:disabled:hover { background: var(--panel); color: var(--accent); }
  #ctl { margin-top: 10px; }
  /* files */
  td.size { color: var(--dim); white-space: nowrap; text-align: right; }
  td.act { text-align: right; white-space: nowrap; }
  a.dl { color: var(--accent); text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
  a.del { color: var(--err); text-decoration: none; margin-left: 12px; cursor: pointer; }
  a.del:hover { text-decoration: underline; }
  .empty { color: var(--dim); font-style: italic; }
  /* upload */
  #uprow { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  input[type=file] { color: var(--dim); font-size: 13px; }
  #upmsg { font-size: 13px; }
  footer { color: var(--dim); font-size: 12px; text-align: center; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>SCPI Logger</h1>
  <span id="demo">DEMO</span>
</header>

<section>
  <h2>Measurement</h2>
  <div id="badges">
    <span class="badge" id="b-run">running</span>
    <span class="badge" id="b-sd">SD card</span>
    <span class="badge" id="b-inst">instrument</span>
  </div>
  <div id="idn">&mdash;</div>
  <table id="values"></table>
  <div id="meta">
    interval <b id="m-int">&mdash;</b> &middot;
    logging to <b id="m-file">&mdash;</b> &middot;
    SD free <b id="m-sd">&mdash;</b>
  </div>
  <div id="ctl"><button id="btn-run">Start</button></div>
</section>

<section>
  <h2>CSV files</h2>
  <table id="files"></table>
</section>

<section>
  <h2>Profiles</h2>
  <table id="profiles"></table>
  <div id="uprow">
    <input type="file" id="upfile" accept=".json">
    <button id="btn-up">Upload</button>
    <span id="upmsg"></span>
  </div>
</section>

<footer>SCPI Logger &middot; &copy;2026 fotoventus.cz</footer>

<script>
"use strict";

// ---- demo data shown when the device API is unreachable (visual check) ----
const DEMO = {
  status: {
    idn: "RIGOL TECHNOLOGIES,DP832A,DP8A0000000001,00.01.16",
    profile: "Rigol DP832A PSU",
    running: true, intervalMs: 1000, file: "rigol_dp832a_0003.csv",
    sd: { mounted: true, freeMb: 29014, totalMb: 30416 },
    values: [
      { label: "CH1 U", value: 12.0012, unit: "V" },
      { label: "CH1 I", value: 0.2410,  unit: "A" },
      { label: "CH2 U", value: 5.0003,  unit: "V" },
      { label: "CH2 I", value: 0.1204,  unit: "A" },
      { label: "CH3 U", value: 3.2999,  unit: "V" },
      { label: "CH3 I", value: 0.0501,  unit: "A" },
    ],
  },
  files: [
    { name: "rigol_dp832a_0003.csv", size: 1834521 },
    { name: "rigol_dp832a_0002.csv", size: 10485760 },
    { name: "rigol_dm3058e_0001.csv", size: 48210 },
  ],
  profiles: [
    { name: "rigol_dm3058e.json", size: 512 },
    { name: "rigol_dp832a.json", size: 890 },
  ],
};

let demoMode = false;
let running = false;

function setDemo(on) {
  demoMode = on;
  document.getElementById("demo").style.display = on ? "inline-block" : "none";
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(r.status);
  return r;
}

function fmtSize(b) {
  if (b >= 1048576) return (b / 1048576).toFixed(1) + " MB";
  if (b >= 1024) return (b / 1024).toFixed(1) + " kB";
  return b + " B";
}

function badge(id, on, textOn, textOff) {
  const el = document.getElementById(id);
  el.className = "badge " + (on ? "on" : "off");
  el.textContent = on ? textOn : textOff;
}

// ---- status ----
function renderStatus(s) {
  running = !!s.running;
  badge("b-run", s.running, "running", "stopped");
  badge("b-sd", s.sd && s.sd.mounted, "SD card", "no SD");
  badge("b-inst", !!s.idn, s.profile || "instrument", "no instrument");
  document.getElementById("idn").textContent = s.idn || "waiting for instrument";

  const t = document.getElementById("values");
  t.innerHTML = "";
  (s.values || []).forEach(v => {
    const r = t.insertRow();
    r.insertCell().textContent = v.label;
    const c = r.insertCell();
    c.className = "v";
    c.textContent = (v.value === null || Number.isNaN(v.value))
      ? "—" : v.value.toFixed(4) + " " + v.unit;
  });

  document.getElementById("m-int").textContent = (s.intervalMs / 1000) + " s";
  document.getElementById("m-file").textContent = s.file || "—";
  document.getElementById("m-sd").textContent =
    s.sd && s.sd.mounted ? s.sd.freeMb + "/" + s.sd.totalMb + " MB" : "—";

  const b = document.getElementById("btn-run");
  b.textContent = s.running ? "Stop" : "Start";
  b.className = s.running ? "stop" : "";
  b.disabled = !s.idn; // no instrument = nothing to start/stop
}

async function pollStatus() {
  try {
    const r = await api("/api/status");
    setDemo(false);
    renderStatus(await r.json());
  } catch (e) {
    setDemo(true);
    renderStatus(DEMO.status);
  }
}

// ---- file lists ----
async function delFile(base, name) {
  if (demoMode) { alert("demo mode - nothing deleted"); return; }
  if (!confirm("Delete " + name + "?")) return;
  try {
    await api(base + encodeURIComponent(name), { method: "DELETE" });
  } catch (e) {
    alert("delete failed (file may be in use - stop logging first)");
  }
  loadLists();
}

function renderList(tableId, items, dlBase) {
  const t = document.getElementById(tableId);
  t.innerHTML = "";
  if (!items.length) {
    const r = t.insertRow();
    const c = r.insertCell();
    c.colSpan = 3; c.className = "empty"; c.textContent = "no files";
    return;
  }
  items.forEach(f => {
    const r = t.insertRow();
    r.insertCell().textContent = f.name;
    const cs = r.insertCell(); cs.className = "size"; cs.textContent = fmtSize(f.size);
    const ca = r.insertCell(); ca.className = "act";
    const a = document.createElement("a");
    a.className = "dl"; a.textContent = "download";
    a.href = dlBase + encodeURIComponent(f.name); a.download = f.name;
    ca.appendChild(a);
    const d = document.createElement("a");
    d.className = "del"; d.textContent = "delete";
    d.onclick = () => delFile(dlBase, f.name);
    ca.appendChild(d);
  });
}

async function loadLists() {
  try {
    const files = await (await api("/api/files")).json();
    renderList("files", files, "/api/files/");
  } catch (e) {
    renderList("files", DEMO.files, "#");
  }
  try {
    const profiles = await (await api("/api/profiles")).json();
    renderList("profiles", profiles, "/api/profiles/");
  } catch (e) {
    renderList("profiles", DEMO.profiles, "#");
  }
}

// ---- actions ----
document.getElementById("btn-run").onclick = async () => {
  if (demoMode) { DEMO.status.running = !DEMO.status.running; pollStatus(); return; }
  try {
    await api("/api/control", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: running ? "stop" : "start" }),
    });
    pollStatus();
  } catch (e) { /* next poll shows the real state */ }
};

document.getElementById("btn-up").onclick = async () => {
  const inp = document.getElementById("upfile");
  const msg = document.getElementById("upmsg");
  if (!inp.files.length) { msg.textContent = "choose a .json file first"; return; }
  const f = inp.files[0];
  if (demoMode) { msg.textContent = "demo mode - not uploaded"; return; }
  try {
    await api("/api/profiles/" + encodeURIComponent(f.name), {
      method: "PUT", body: await f.text(),
    });
    msg.textContent = "uploaded: " + f.name;
    loadLists();
  } catch (e) {
    msg.textContent = "upload failed";
  }
};

// ---- start ----
pollStatus();
loadLists();
setInterval(pollStatus, 1000);
setInterval(loadLists, 10000);
</script>
</body>
</html>
