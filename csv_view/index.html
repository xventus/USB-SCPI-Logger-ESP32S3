<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCPI Logger Viewer</title>
<meta name="description" content="Offline CSV viewer for SCPI Logger data — charts, tables, multi-file merge, print and export.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--line:#30363d;--line2:#21262d;--text:#c9d1d9;--dim:#8b949e;--accent:#00aaff;--accent2:#0088cc;--ok:#33ff88;--warn:#ffaa00;--err:#ff4466;--purple:#bc8cff;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.6;min-height:100vh}
.app{max-width:1280px;margin:0 auto;padding:0 20px 40px}
.topbar{display:flex;align-items:center;gap:16px;padding:18px 0 16px;border-bottom:1px solid var(--line2);margin-bottom:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 16px rgba(0,170,255,.3);flex-shrink:0}
h1{font-size:1.25rem;font-weight:700;color:var(--text);letter-spacing:-.02em}
h1 span{color:var(--accent)}
.topbar-right{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:7px;font-size:.875rem;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .18s ease;white-space:nowrap;font-family:inherit;text-decoration:none}
.btn-secondary{background:transparent;color:var(--accent);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--accent);background:rgba(0,170,255,.08);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--dim);border-color:var(--line2)}
.btn-ghost:hover{color:var(--text);border-color:var(--line)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-icon{padding:7px 12px}
#drop-zone{border:2px dashed var(--line);border-radius:14px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s ease;background:var(--panel);margin-bottom:20px;position:relative;overflow:hidden}
#drop-zone::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,170,255,.05) 0%,transparent 70%);pointer-events:none}
#drop-zone:hover,#drop-zone.dragover{border-color:var(--accent);background:rgba(0,170,255,.04);box-shadow:0 0 30px rgba(0,170,255,.1)}
#drop-zone.dragover{border-style:solid}
#drop-zone.collapsed{padding:14px 20px;display:flex;align-items:center;gap:12px;text-align:left}
.dz-icon{font-size:3rem;margin-bottom:12px;opacity:.7}
.dz-title{font-size:1.1rem;font-weight:600;color:var(--text);margin-bottom:6px}
.dz-sub{color:var(--dim);font-size:.875rem}
.dz-sub strong{color:var(--accent)}
.dz-main{flex:1}
.file-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.file-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);font-size:.8rem;animation:chipIn .25s ease}
@keyframes chipIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.chip-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chip-name{color:var(--text);font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-rows{color:var(--dim)}
.chip-remove{background:none;border:none;cursor:pointer;color:var(--dim);font-size:1rem;line-height:1;padding:0 2px;transition:color .15s}
.chip-remove:hover{color:var(--err)}
.tab-bar{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin-bottom:20px}
.tab-btn{padding:10px 20px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:.9rem;font-weight:500;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .18s ease;display:flex;align-items:center;gap:7px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-badge{background:var(--line);color:var(--dim);font-size:.7rem;padding:1px 6px;border-radius:10px;font-weight:600}
.tab-btn.active .tab-badge{background:rgba(0,170,255,.15);color:var(--accent)}
.tab-pane{display:none}
.tab-pane.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:18px 20px;transition:border-color .18s}
.card:hover{border-color:var(--line)}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card-icon{font-size:1.1rem}
.card-title{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.meta-table{width:100%;border-collapse:collapse}
.meta-table tr{border-bottom:1px solid var(--line2)}
.meta-table tr:last-child{border-bottom:none}
.meta-table td{padding:6px 4px;font-size:.85rem;vertical-align:top}
.meta-key{color:var(--dim);white-space:nowrap;padding-right:16px!important;width:1%}
.meta-val{color:var(--text);font-family:Consolas,monospace;word-break:break-all}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-label{font-size:.75rem;color:var(--dim);margin-bottom:2px}
.stat-value{font-size:1.3rem;font-weight:700;color:var(--text)}
.u-legend { pointer-events: none; }
.u-legend th { font-weight: 500; color: var(--text-muted); }
.u-legend td { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
.stat-unit{font-size:.75rem;color:var(--dim);font-weight:400;margin-left:3px}
.ch-list{display:flex;flex-direction:column;gap:6px}
.ch-row{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:7px;background:var(--panel2);font-size:.85rem}
.ch-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.ch-name{flex:1;color:var(--text);font-family:monospace}
.ch-stats{color:var(--dim);font-size:.78rem;display:flex;gap:8px}
.ch-stats b{color:var(--text)}
.chart-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.channel-toggles{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.ch-toggle{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:.8rem;transition:all .15s;user-select:none;font-family:inherit}
.ch-toggle:hover{background:var(--panel)}
.ch-toggle.inactive{opacity:.4}
.ch-toggle-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chart-wrap{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:16px;position:relative;overflow:hidden}
#chart-container{width:100%;min-height:380px}
.delta-bar{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-top:12px;font-size:.85rem;flex-wrap:wrap}
.delta-bar.visible{display:flex}
.delta-label{color:var(--dim)}
.delta-val{color:var(--warn);font-weight:600;font-family:monospace}
.delta-sep{color:var(--line)}
.delta-clear{margin-left:auto}
.pin-line{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;opacity:.85;z-index:50}
.pin-label{position:absolute;top:4px;font-size:.7rem;font-weight:700;padding:1px 5px;border-radius:3px;pointer-events:none;transform:translateX(-50%);white-space:nowrap;z-index:51;color:#000}
.chart-footer{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.chart-hint{color:var(--dim);font-size:.78rem;flex:1}
.table-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.table-search{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:7px;font-size:.875rem;font-family:inherit;transition:border-color .18s}
.table-search:focus{outline:none;border-color:var(--accent)}
.table-search::placeholder{color:var(--dim)}
.table-wrap{background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:auto;max-height:520px}
table.data-table{width:100%;border-collapse:collapse;font-size:.85rem}
.data-table th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}
.data-table th:hover{color:var(--text)}
.data-table th.sort-asc::after{content:" \u2191";color:var(--accent)}
.data-table th.sort-desc::after{content:" \u2193";color:var(--accent)}
.data-table td{padding:7px 14px;border-bottom:1px solid var(--line2);font-family:Consolas,monospace;color:var(--text);white-space:nowrap}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(255,255,255,.025)}
.data-table td.ts-col{color:var(--dim)}
.pagination{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--panel2);border-top:1px solid var(--line2);font-size:.85rem;border-radius:0 0 12px 12px}
.page-info{flex:1;color:var(--dim)}
.page-info b{color:var(--text)}
.placeholder{text-align:center;padding:60px 20px;color:var(--dim)}
.placeholder-icon{font-size:2.5rem;margin-bottom:12px;opacity:.5}
.placeholder-text{font-size:.95rem}
#toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none}
.toast{padding:10px 18px;border-radius:8px;font-size:.875rem;font-weight:500;border:1px solid;animation:toastIn .25s ease;pointer-events:auto;max-width:320px}
.toast-ok{background:rgba(51,255,136,.1);border-color:var(--ok);color:var(--ok)}
.toast-err{background:rgba(255,68,102,.1);border-color:var(--err);color:var(--err)}
.toast-warn{background:rgba(255,170,0,.1);border-color:var(--warn);color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
/* uPlot base CSS */
.uplot,.uplot *,.uplot *::before,.uplot *::after{box-sizing:border-box}
.uplot{font-family:system-ui,sans-serif;line-height:1.5;width:min-content}
.u-wrap{position:relative;user-select:none}
.u-over,.u-under{position:absolute}
.u-under{overflow:hidden}
.uplot canvas{display:block;position:relative;width:100%;height:100%}
.u-axis{position:absolute}
.u-legend{font-size:14px;margin:auto;text-align:center}
.u-inline{display:block}.u-inline *{display:inline-block}
.u-inline tr{margin-right:16px}
.u-legend th{padding:0 8px}
.u-legend .u-marker{width:1em;height:1em;margin-right:.25em;border:2px solid transparent}
.u-label,.u-value{display:block}
.u-series>*{padding:4px 8px}
.u-series:first-child>*{padding-top:0;padding-bottom:0}
.u-cursor-x,.u-cursor-y{position:absolute;left:0;top:0;pointer-events:none;will-change:transform;z-index:100}
.u-hz .u-cursor-x{width:0;border-right:1px dashed rgba(255,255,255,.3);height:100%}
.u-hz .u-cursor-y{width:100%;border-bottom:1px dashed rgba(255,255,255,.3);height:0}
.u-cursor-pt{position:absolute;top:0;left:0;border-radius:50%;border:0 solid;pointer-events:none;will-change:transform;z-index:100}
.u-select{position:absolute;display:none;background:rgba(0,170,255,.07);border:1px solid rgba(0,170,255,.25)}
.u-hz .u-select{height:100%;top:0}
.u-vt .u-select{width:100%;left:0}
.u-off{display:none!important}
@media print{
body{background:#fff;color:#111;font-size:12px}
.topbar-right,.tab-bar,.chart-toolbar,.chart-footer,.table-toolbar,.pagination,
#drop-zone,.file-chips,.delta-bar,#toast-container,.ch-list{display:none!important}
.card{border:1px solid #ddd;background:#fafafa;page-break-inside:avoid}
.card-title,.meta-key,.stat-label{color:#555}
.meta-val,.stat-value{color:#111}
.tab-pane{display:block!important;opacity:1!important}
.tab-pane#tab-info{page-break-after:always}
.chart-wrap{border:none!important;padding:0!important;page-break-inside:avoid;max-width:100%!important}
.uplot{max-width:100%!important}
.uplot canvas{max-width:100%!important;height:auto!important}
.table-wrap{max-height:none!important;overflow:visible!important;border:none!important}
table.data-table{width:100%!important;font-size:10px!important}
.data-table th{background:#eee!important;color:#444!important;-webkit-print-color-adjust:exact;color-adjust:exact}
.data-table td{color:#111!important;border-color:#ddd!important}
.data-table tr{page-break-inside:avoid}
h1 span{color:#0055aa}
}

</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logo">
    <div class="logo-icon">&#128202;</div>
    <h1>SCPI Logger <span>Viewer</span></h1>
  </div>
  <div class="topbar-right">
    <button class="btn btn-secondary" id="btn-add-file">+ Add CSV</button>
    <button class="btn btn-ghost btn-icon" id="btn-print" title="Print">&#128424;</button>
    <button class="btn btn-ghost btn-icon" id="btn-export-png" title="Export chart PNG" disabled>&#11015; PNG</button>
  </div>
</header>
<input type="file" id="dz-input" accept=".csv,.txt" multiple style="display:none">
<input type="file" id="add-input" accept=".csv,.txt" multiple style="display:none">
<div id="drop-zone" tabindex="0" role="button" aria-label="Drop CSV files here or click to browse">
  <div class="dz-icon">&#128194;</div>
  <div class="dz-main">
    <div class="dz-title">Drop CSV files here</div>
    <div class="dz-sub">or <strong>click to browse</strong> &mdash; supports SCPI Logger formats</div>
  </div>
</div>
<div class="file-chips" id="file-chips" style="display:none"></div>
<div id="main-content" style="display:none">
  <nav class="tab-bar" role="tablist">
    <button class="tab-btn active" data-tab="tab-info">&#9432; Info <span class="tab-badge" id="badge-info">0</span></button>
    <button class="tab-btn" data-tab="tab-chart">&#128200; Chart</button>
    <button class="tab-btn" data-tab="tab-table">&#9783; Table <span class="tab-badge" id="badge-table">0</span></button>
  </nav>
  <div class="tab-pane active" id="tab-info">
    <div class="info-grid" id="info-grid">
      <div class="placeholder"><div class="placeholder-icon">&#128203;</div><div class="placeholder-text">No data loaded</div></div>
    </div>
  </div>
  <div class="tab-pane" id="tab-chart">
    <div class="chart-toolbar">
      <div class="channel-toggles" id="channel-toggles"></div>
    </div>
    <div class="chart-wrap">
      <div id="chart-container"></div>
    </div>
    <div class="delta-bar" id="delta-bar">
      <span class="delta-label">&#128204; Marker A:</span>
      <span class="delta-val" id="delta-a">&mdash;</span>
      <span class="delta-sep">&rarr;</span>
      <span class="delta-label">&#128204; Marker B:</span>
      <span class="delta-val" id="delta-b">&mdash;</span>
      <span class="delta-sep">|</span>
      <span class="delta-label">&Delta;t =</span>
      <span class="delta-val" id="delta-dt">&mdash;</span>
      <span id="delta-values-wrap"></span>
      <button class="btn btn-ghost delta-clear" id="btn-clear-markers">Clear markers</button>
    </div>
    <div class="chart-footer">
      <span class="chart-hint">Drag to zoom &middot; Scroll to zoom &middot; Double-click to reset &middot; <b>Click</b> to pin marker A/B (&Delta; readout)</span>
      <button class="btn btn-ghost" id="btn-reset-zoom">Reset zoom</button>
      <button class="btn btn-ghost" id="btn-export-png2">&#11015; Export PNG</button>
    </div>
  </div>
  <div class="tab-pane" id="tab-table">
    <div class="table-toolbar">
      <input type="search" class="table-search" id="table-search" placeholder="Filter rows&hellip;">
      <button class="btn btn-ghost" id="btn-export-csv">&#11015; Export CSV</button>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="data-table">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination" style="display:none">
      <span class="page-info" id="page-info"></span>
      <button class="btn btn-ghost" id="btn-prev">&larr; Prev</button>
      <button class="btn btn-ghost" id="btn-next">Next &rarr;</button>
    </div>
  </div>
</div>
</div>
<div id="toast-container"></div>

<script>

"use strict";
const COLORS=["#00aaff","#33ff88","#ffaa00","#bc8cff","#ff6b6b","#00d4c8","#ff9f43","#54a0ff","#5f27cd","#ff9ff3"];
const PAGE_SIZE=100;
let files=[],mergedData=null,uplot=null;
let sortCol=0,sortDir=1,currentPage=0,filterText="",filteredRows=[];
let pinA=null,pinB=null;

function parseCsv(text,filename){
  const lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
  const meta={};let dataLines=[],headerLine=null;
  for(const l of lines){
    const t=l.trim();if(!t)continue;
    if(t.startsWith("#")){const m=t.match(/^#\s*([^:]+?)\s*:\s*(.+)$/);if(m)meta[m[1].trim()]=m[2].trim();}
    else if(headerLine===null)headerLine=t;
    else dataLines.push(t);
  }
  if(!headerLine)throw new Error("No header row in "+filename);
  const sep=headerLine.includes(";")?";": ",";
  const headers=headerLine.split(sep).map(h=>h.trim());
  const rows=dataLines.filter(l=>l.trim()).map(line=>{
    const parts=line.split(sep);const row={};
    headers.forEach((h,i)=>{const v=(parts[i]||"").trim();row[h]=v===""?null:(isNaN(v)?v:parseFloat(v));});
    return row;
  });
  return{name:filename,meta,headers,rows,sep};
}

function buildMergedData(){
  if(!files.length){mergedData=null;return;}
  const channels=[];
  files.forEach((f,fi)=>{
    f.headers.slice(1).forEach(h=>{
      channels.push({label:h,fileLabel:f.name.replace(/\.csv$/i,""),color:COLORS[channels.length%COLORS.length],fileIdx:fi,header:h,visible:true});
    });
  });
  let allTs=[];
  files.forEach(f=>f.rows.forEach(r=>{const ts=r[f.headers[0]];if(typeof ts==="number")allTs.push(ts);}));
  allTs=[...new Set(allTs)].sort((a,b)=>a-b);
  channels.forEach(ch=>{
    const f=files[ch.fileIdx];const tsKey=f.headers[0];
    const map=new Map();f.rows.forEach(r=>map.set(r[tsKey],r[ch.header]));
    ch.data=allTs.map(ts=>{const v=map.get(ts);return(typeof v==="number")?v:null;});
  });
  mergedData={timestamps:allTs,channels};
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function fmt(v){
  if(v===null||v===undefined||isNaN(v))return"\u2014";
  if(Math.abs(v)===0)return"0";
  if(Math.abs(v)>=1000)return v.toFixed(1);
  if(Math.abs(v)>=100)return v.toFixed(2);
  if(Math.abs(v)>=1)return v.toFixed(4);
  return v.toPrecision(5);
}

function fmtT(v){
  if(typeof v==="string")return v;
  if(typeof v!=="number")return String(v);
  const neg=v<0;v=Math.abs(v);
  const h=Math.floor(v/3600),m=Math.floor((v%3600)/60),s=v%60;
  let r;
  if(h>0)r=h+":"+String(m).padStart(2,"0")+":"+s.toFixed(3).padStart(6,"0");
  else if(m>0)r=m+":"+s.toFixed(3).padStart(6,"0");
  else r=s.toFixed(3);
  return neg?"-"+r:r;
}

function fmtDur(s){
  if(s<60)return s.toFixed(1)+" s";
  if(s<3600)return(s/60).toFixed(1)+" min";
  return(s/3600).toFixed(2)+" h";
}

function toast(msg,type){
  type=type||"ok";
  const con=document.getElementById("toast-container");
  const t=document.createElement("div");t.className="toast toast-"+type;t.textContent=msg;con.appendChild(t);
  setTimeout(()=>{t.style.transition="opacity .3s";t.style.opacity="0";setTimeout(()=>t.remove(),350);},3500);
}

function makeCard(icon,title){
  const frag=document.createDocumentFragment();
  const card=document.createElement("div");card.className="card";
  card.innerHTML="<div class='card-header'><span class='card-icon'>"+icon+"</span><span class='card-title'>"+esc(title)+"</span></div>";
  frag.appendChild(card);return{frag,card};
}

function renderInfoTab(){
  const grid=document.getElementById("info-grid");grid.innerHTML="";
  if(!mergedData){
    grid.innerHTML="<div class='placeholder'><div class='placeholder-icon'>\u{1F4CB}</div><div class='placeholder-text'>No data loaded</div></div>";
    return;
  }
  files.forEach((f,fi)=>{
    const c=makeCard("\u{1F52C}",(files.length>1?"["+(fi+1)+"] ":"")+"Device Info");
    const mt=document.createElement("table");mt.className="meta-table";
    const entries=Object.entries(f.meta);
    if(!entries.length){mt.innerHTML="<tr><td class='meta-val' style='color:var(--dim);font-style:italic'>No metadata in file header</td></tr>";}
    else entries.forEach(([k,v])=>{const tr=document.createElement("tr");tr.innerHTML="<td class='meta-key'>"+esc(k)+"</td><td class='meta-val'>"+esc(v)+"</td>";mt.appendChild(tr);});
    c.card.appendChild(mt);grid.appendChild(c.frag);
  });
  const ts=mergedData.timestamps;const dur=ts.length>1?ts[ts.length-1]-ts[0]:0;
  const sc=makeCard("\u{1F4C8}","Measurement Stats");
  const sg=document.createElement("div");sg.className="stat-grid";
  sg.innerHTML=
    "<div class='stat-item'><div class='stat-label'>Total Samples</div><div class='stat-value'>"+ts.length.toLocaleString()+"</div></div>"+
    "<div class='stat-item'><div class='stat-label'>Duration</div><div class='stat-value'>"+fmtDur(dur)+"</div></div>"+
    "<div class='stat-item'><div class='stat-label'>Channels</div><div class='stat-value'>"+mergedData.channels.length+"<span class='stat-unit'>total</span></div></div>"+
    "<div class='stat-item'><div class='stat-label'>Files</div><div class='stat-value'>"+files.length+"<span class='stat-unit'>loaded</span></div></div>";
  sc.card.appendChild(sg);grid.appendChild(sc.frag);
  const cc=makeCard("\u223C","Channels");
  const cl=document.createElement("div");cl.className="ch-list";
  mergedData.channels.forEach(ch=>{
    const d=ch.data.filter(v=>v!==null);
    const mn=d.length?Math.min(...d):0,mx=d.length?Math.max(...d):0;
    const av=d.length?d.reduce((s,v)=>s+v,0)/d.length:0;
    const row=document.createElement("div");row.className="ch-row";
    row.innerHTML=
      "<div class='ch-dot' style='background:"+ch.color+"'></div>"+
      "<span class='ch-name'>"+esc(ch.label)+"</span>"+
      "<span class='ch-stats'>"+
        "<span class='ch-stat'>min <b>"+fmt(mn)+"</b></span>"+
        "<span class='ch-stat'>max <b>"+fmt(mx)+"</b></span>"+
        "<span class='ch-stat'>avg <b>"+fmt(av)+"</b></span>"+
      "</span>"+
      (files.length>1?"<span style='color:var(--dim);font-size:.75rem'>["+esc(ch.fileLabel)+"]</span>":"");
    cl.appendChild(row);
  });
  cc.card.appendChild(cl);grid.appendChild(cc.frag);
  document.getElementById("badge-info").textContent=files.length;
}

function renderChart(){
  if(uplot){uplot.destroy();uplot=null;}
  pinA=null;pinB=null;updateDeltaBar();
  const con=document.getElementById("chart-container");con.innerHTML="";
  if(!mergedData||!mergedData.timestamps.length){
    con.innerHTML="<div class='placeholder'><div class='placeholder-icon'>\u{1F4CA}</div><div class='placeholder-text'>No chart data</div></div>";
    return;
  }
  const tog=document.getElementById("channel-toggles");tog.innerHTML="";
  mergedData.channels.forEach((ch,i)=>{
    const b=document.createElement("button");
    b.className="ch-toggle"+(ch.visible?" active":" inactive");
    b.dataset.idx=i;
    b.innerHTML="<span class='ch-toggle-dot' style='background:"+ch.color+"'></span>"+esc(ch.label);
    b.addEventListener("click",()=>{
      ch.visible=!ch.visible;
      b.className="ch-toggle"+(ch.visible?" active":" inactive");
      if(uplot)uplot.setSeries(i+1,{show:ch.visible});
    });
    tog.appendChild(b);
  });
  const uData=[
    new Float64Array(mergedData.timestamps),
    ...mergedData.channels.map(ch=>new Float64Array(ch.data.map(v=>v===null?NaN:v)))
  ];
  const w=con.clientWidth||900;
  const showPts=mergedData.timestamps.length<300;
  const series=[
    {label:"Time (s)",value:(u,v)=>v!=null?fmt(v)+" s":"\u2014"},
    ...mergedData.channels.map(ch=>({
      label:ch.label,stroke:ch.color,width:2,show:ch.visible,spanGaps:false,
      value:(u,v)=>v!=null&&!isNaN(v)?fmt(v):"\u2014",
      points:{show:showPts,size:4,fill:ch.color},
    }))
  ];
  const opts={
    width:w,height:380,
    cursor:{drag:{x:true,y:false,setScale:true},focus:{prox:16}},
    axes:[
      {
        label:"Time (s)",stroke:"#8b949e",
        ticks:{stroke:"#30363d",width:1},
        grid:{stroke:"#21262d",width:1},
        font:"12px Inter,system-ui",
        labelFont:"12px Inter,system-ui",
        values:(u,vals)=>vals.map(v=>v!=null?fmtT(v):"")
      },
      {
        label:"Value",stroke:"#8b949e",
        ticks:{stroke:"#30363d",width:1},
        grid:{stroke:"#21262d",width:1},
        font:"12px Inter,system-ui",
        labelFont:"12px Inter,system-ui"
      },
    ],
    scales:{x:{time:false}},
    series,
    hooks:{
      ready:[u=>{
        u.over.addEventListener("click",e=>{
          const cx=e.clientX-u.over.getBoundingClientRect().left;
          setPin(u,closestIdx(mergedData.timestamps,u.posToVal(cx,"x")));
        });
      }],
      setSize:[u=>{
        u.over.querySelectorAll(".pin-line,.pin-label").forEach(el=>el.remove());
        redrawPins(u);
      }],
    }
  };
  try{
    uplot=new uPlot(opts,uData,con);
    document.getElementById("btn-export-png").disabled=false;
  }catch(e){
    con.innerHTML="<div class='placeholder'><div class='placeholder-icon'>\u26A0</div><div class='placeholder-text'>Chart error: "+esc(e.message)+"</div></div>";
    toast("Chart error: "+e.message,"err");
  }
}

function closestIdx(arr,val){
  let lo=0,hi=arr.length-1;
  while(lo<hi){const mid=lo+hi>>1;if(arr[mid]<val)lo=mid+1;else hi=mid;}
  return lo;
}

function setPin(u,idx){
  if(pinA===null)pinA={idx};
  else if(pinB===null)pinB={idx};
  else{pinB=pinA;pinA={idx};}
  redrawPins(u);updateDeltaBar();
}

function redrawPins(u){
  u.over.querySelectorAll(".pin-line,.pin-label").forEach(el=>el.remove());
  [[pinA,"#ffaa00","A"],[pinB,"#bc8cff","B"]].forEach(([pin,color,lbl])=>{
    if(!pin)return;
    const xv=mergedData.timestamps[pin.idx];
    const px=u.valToPos(xv,"x");
    const line=document.createElement("div");
    line.className="pin-line";line.style.left=px+"px";line.style.background=color;
    u.over.appendChild(line);
    const la=document.createElement("div");
    la.className="pin-label";la.style.left=px+"px";la.style.background=color;
    la.textContent=lbl+": "+fmtT(xv)+"s";
    u.over.appendChild(la);
  });
}

function updateDeltaBar(){
  const bar=document.getElementById("delta-bar");
  if(!pinA&&!pinB){bar.classList.remove("visible");return;}
  bar.classList.add("visible");
  const tsA=pinA?mergedData.timestamps[pinA.idx]:null;
  const tsB=pinB?mergedData.timestamps[pinB.idx]:null;
  document.getElementById("delta-a").textContent=tsA!==null?fmtT(tsA)+" s":"\u2014";
  document.getElementById("delta-b").textContent=tsB!==null?fmtT(tsB)+" s":"\u2014";
  document.getElementById("delta-dt").textContent=(tsA!==null&&tsB!==null)?fmt(Math.abs(tsB-tsA))+" s":"\u2014";
  const dv=document.getElementById("delta-values-wrap");dv.innerHTML="";
  mergedData.channels.forEach(ch=>{
    if(!ch.visible)return;
    const vA=pinA?ch.data[pinA.idx]:null;
    const vB=pinB?ch.data[pinB.idx]:null;
    if(vA!==null||vB!==null){
      const span=document.createElement("span");
      span.style.cssText="display:inline-flex;align-items:center;gap:4px;";
      let html="<span class='delta-sep'>|</span><span style='color:"+ch.color+";font-size:.8rem'>"+esc(ch.label)+"</span>";
      if(vA!==null)html+="<span class='delta-label'> A:</span><span class='delta-val'>"+fmt(vA)+"</span>";
      if(vB!==null)html+="<span class='delta-label'> B:</span><span class='delta-val'>"+fmt(vB)+"</span>";
      if(vA!==null&&vB!==null){
        const d=vB-vA;
        html+="<span class='delta-label'> \u0394=</span><span class='delta-val'>"+(d>=0?"+":"")+fmt(d)+"</span>";
      }
      span.innerHTML=html;
      dv.appendChild(span);
    }
  });
}

function renderTableTab(){
  if(!mergedData)return;
  filteredRows=mergedData.timestamps.map((ts,i)=>{
    const r={_ts:ts};
    mergedData.channels.forEach(ch=>{r[ch.label]=ch.data[i];});
    return r;
  });
  applyFilter();
}

function applyFilter(){
  if(!mergedData)return;
  const q=filterText.toLowerCase();
  const all=mergedData.timestamps.map((ts,i)=>{
    const r={_ts:ts};
    mergedData.channels.forEach(ch=>{r[ch.label]=ch.data[i];});
    return r;
  });
  filteredRows=q
    ?all.filter(r=>Object.values(r).some(v=>String(v===null?"":v).toLowerCase().includes(q)))
    :all;
  filteredRows.sort((a,b)=>(a._ts<b._ts?-1:a._ts>b._ts?1:0)*sortDir);
  currentPage=0;renderTablePage();
}

function renderTablePage(){
  const thead=document.getElementById("table-head");
  const tbody=document.getElementById("table-body");
  thead.innerHTML="";
  const tr=document.createElement("tr");
  const cols=["timestamp_s",...mergedData.channels.map(c=>c.label)];
  cols.forEach((col,ci)=>{
    const th=document.createElement("th");th.textContent=col;
    if(ci===sortCol)th.className=sortDir>0?"sort-asc":"sort-desc";
    th.addEventListener("click",()=>{
      if(sortCol===ci)sortDir=-sortDir;else{sortCol=ci;sortDir=1;}
      applyFilter();
    });
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  tbody.innerHTML="";
  const start=currentPage*PAGE_SIZE;
  const page=filteredRows.slice(start,start+PAGE_SIZE);
  page.forEach(row=>{
    const tr=document.createElement("tr");
    const tdts=document.createElement("td");
    tdts.className="ts-col";tdts.textContent=fmtT(row._ts);tr.appendChild(tdts);
    mergedData.channels.forEach(ch=>{
      const td=document.createElement("td");
      const v=row[ch.label];
      td.textContent=(v!==null&&v!==undefined)?fmt(v):"\u2014";
      if(v!==null&&v!==undefined)td.style.color=ch.color;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  const total=Math.ceil(filteredRows.length/PAGE_SIZE);
  const pag=document.getElementById("pagination");
  if(filteredRows.length>PAGE_SIZE){
    pag.style.display="flex";
    document.getElementById("page-info").innerHTML=
      "Showing <b>"+(start+1)+"\u2013"+Math.min(start+PAGE_SIZE,filteredRows.length)+
      "</b> of <b>"+filteredRows.length.toLocaleString()+"</b> rows";
    document.getElementById("btn-prev").disabled=currentPage===0;
    document.getElementById("btn-next").disabled=currentPage>=total-1;
  }else{
    pag.style.display="none";
  }
  document.getElementById("badge-table").textContent=filteredRows.length.toLocaleString();
}

function renderFileChips(){
  const con=document.getElementById("file-chips");
  con.innerHTML="";con.style.display=files.length?"flex":"none";
  files.forEach((f,fi)=>{
    const chip=document.createElement("div");chip.className="file-chip";
    chip.innerHTML=
      "<span class='chip-dot' style='background:"+COLORS[fi%COLORS.length]+"'></span>"+
      "<span class='chip-name' title='"+esc(f.name)+"'>"+esc(f.name)+"</span>"+
      "<span class='chip-rows'>"+f.rows.length+" rows</span>"+
      "<button class='chip-remove' data-idx='"+fi+"' title='Remove'>\u2715</button>";
    chip.querySelector(".chip-remove").addEventListener("click",()=>removeFile(fi));
    con.appendChild(chip);
  });
}

function updateDropZone(){
  const dz=document.getElementById("drop-zone");
  if(files.length>0){
    dz.className="collapsed";
    dz.innerHTML=
      "<div class='dz-icon'>\u{1F4C2}</div>"+
      "<div class='dz-main'><div class='dz-title'>"+files.length+" file"+(files.length>1?"s":"")+" loaded"+
      "</div><div class='dz-sub'>Click to reload different files</div></div>";
  }else{
    dz.className="";
    dz.innerHTML=
      "<div class='dz-icon'>\u{1F4C2}</div>"+
      "<div class='dz-main'><div class='dz-title'>Drop CSV files here</div>"+
      "<div class='dz-sub'>or <strong>click to browse</strong></div></div>";
  }
}

function loadFileObjects(fileList,replace){
  const promises=Array.from(fileList).map(file=>new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{try{res(parseCsv(e.target.result,file.name));}catch(err){rej({name:file.name,err});}};
    reader.onerror=()=>rej({name:file.name,err:reader.error});
    reader.readAsText(file,"utf-8");
  }));
  Promise.allSettled(promises).then(results=>{
    let added=0;let doReplace=replace;
    results.forEach(r=>{
      if(r.status==="fulfilled"){
        const f=r.value;
        if(doReplace){files=[];doReplace=false;}
        if(!files.find(x=>x.name===f.name)){files.push(f);added++;}
        else toast("Already loaded: "+f.name,"warn");
      }else{
        toast("Error: "+r.reason.name+" \u2014 "+(r.reason.err.message||r.reason.err),"err");
      }
    });
    if(added>0){buildMergedData();refreshAll();toast("Loaded "+added+" file"+(added>1?"s":""),"ok");}
  });
}

function removeFile(idx){files.splice(idx,1);buildMergedData();refreshAll();}

function refreshAll(){
  const has=files.length>0&&mergedData;
  document.getElementById("main-content").style.display=has?"block":"none";
  renderFileChips();updateDropZone();
  if(has){renderInfoTab();renderChart();renderTableTab();}
}

async function exportPng(){
  if(!uplot){toast("No chart to export","warn");return;}
  const c=uplot.ctx.canvas;
  const out=document.createElement("canvas");out.width=c.width;out.height=c.height;
  const ctx=out.getContext("2d");
  ctx.fillStyle="#0d1117";ctx.fillRect(0,0,out.width,out.height);ctx.drawImage(c,0,0);
  
  const fName = files.length > 0 ? files[0].name.replace(/\.csv$/i,"") + "_chart.png" : "scpi_chart.png";
  const dataUrl = out.toDataURL("image/png");
  const arr = dataUrl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while(n--){ u8arr[n]=bstr.charCodeAt(n); }
  const blob = new Blob([u8arr],{type:mime});

  if(window.showSaveFilePicker){
    try{
      const handle=await window.showSaveFilePicker({
        suggestedName: fName,
        types:[{description:'PNG Image',accept:{'image/png':['.png']}}]
      });
      const writable=await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      toast("Chart saved successfully","ok");
      return;
    }catch(e){
      if(e.name!=='AbortError') console.error(e);
      return;
    }
  }

  const link=document.createElement("a");
  link.download=fName;
  link.href=dataUrl;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

async function exportCsv(){
  if(!mergedData)return;
  let csv=["timestamp_s",...mergedData.channels.map(c=>c.label)].join(",")+"\n";
  mergedData.timestamps.forEach((ts,i)=>{
    csv+=[fmtT(ts),...mergedData.channels.map(ch=>{
      const v=ch.data[i];return v!==null?v:"";
    })].join(",")+"\n";
  });
  
  const fName = files.length > 0 ? files[0].name.replace(/\.csv$/i,"") + "_merged.csv" : "scpi_merged.csv";
  
  if(window.showSaveFilePicker){
    try{
      const blob=new Blob([csv],{type:"text/csv"});
      const handle=await window.showSaveFilePicker({
        suggestedName: fName,
        types:[{description:'CSV File',accept:{'text/csv':['.csv']}}]
      });
      const writable=await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      toast("CSV saved successfully","ok");
      return;
    }catch(e){
      if(e.name!=='AbortError') console.error(e);
      return;
    }
  }

  const link=document.createElement("a");
  link.download=fName;
  link.href="data:text/csv;charset=utf-8," + encodeURIComponent(csv);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Event wiring
const dz=document.getElementById("drop-zone");
dz.addEventListener("click",()=>document.getElementById("dz-input").click());
dz.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")dz.click();});
dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("dragover");});
dz.addEventListener("dragleave",()=>dz.classList.remove("dragover"));
dz.addEventListener("drop",e=>{
  e.preventDefault();dz.classList.remove("dragover");
  loadFileObjects(e.dataTransfer.files,true);
});
document.getElementById("dz-input").addEventListener("change",e=>{
  if(e.target.files.length)loadFileObjects(e.target.files,true);e.target.value="";
});
document.getElementById("btn-add-file").addEventListener("click",()=>
  document.getElementById("add-input").click());
document.getElementById("add-input").addEventListener("change",e=>{
  if(e.target.files.length)loadFileObjects(e.target.files,false);e.target.value="";
});
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-pane").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("active");
    if(btn.dataset.tab==="tab-chart"&&uplot){
      requestAnimationFrame(()=>{
        const w=document.getElementById("chart-container").clientWidth;
        if(w>0)uplot.setSize({width:w,height:380});
      });
    }
  });
});
document.getElementById("btn-print").addEventListener("click",()=>window.print());
document.getElementById("btn-export-png").addEventListener("click",exportPng);
document.getElementById("btn-export-png2").addEventListener("click",exportPng);
document.getElementById("btn-export-csv").addEventListener("click",exportCsv);
document.getElementById("btn-reset-zoom").addEventListener("click",()=>{
  if(uplot){
    uplot.setScale("x",{min:uplot.data[0][0],max:uplot.data[0][uplot.data[0].length-1]});
    uplot.setScale("y",{min:null,max:null});
  }
});
document.getElementById("btn-clear-markers").addEventListener("click",()=>{
  pinA=null;pinB=null;
  if(uplot)uplot.over.querySelectorAll(".pin-line,.pin-label").forEach(el=>el.remove());
  updateDeltaBar();
});
document.getElementById("table-search").addEventListener("input",e=>{
  filterText=e.target.value;if(mergedData)applyFilter();
});
document.getElementById("btn-prev").addEventListener("click",()=>{
  if(currentPage>0){currentPage--;renderTablePage();}
});
document.getElementById("btn-next").addEventListener("click",()=>{
  const t=Math.ceil(filteredRows.length/PAGE_SIZE);
  if(currentPage<t-1){currentPage++;renderTablePage();}
});
if(typeof ResizeObserver!=="undefined"){
  new ResizeObserver(()=>{
    if(uplot){
      const w=document.getElementById("chart-container").clientWidth;
      if(w>50)uplot.setSize({width:w,height:380});
    }
  }).observe(document.getElementById("chart-container"));
}
